<style>
body{margin:0;padding:0;background:#181818;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{background:#111;padding:15px;border-bottom:2px solid #1dcf60;text-align:center;flex-shrink:0}

.controls-container{padding:20px;background:#222;display:flex;flex-direction:column;gap:15px;width:95%;max-width:1000px;margin:15px auto;flex-shrink:0;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.5);border:1px solid #333;box-sizing:border-box}
.auto-extract-box{width:100%;display:flex;flex-direction:column;gap:10px}

.counter-badge:hover{opacity:.8}

.main-content{display:flex;flex-direction:row;gap:20px;width:95%;max-width:1000px;margin:0 auto 15px;align-items:stretch;flex:1;min-height:0;box-sizing:border-box}
.player-wrapper{flex:3;background:#000;border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,.8);position:relative;min-width:0;height:100%;overflow:hidden}

<body>
<div class="header"><h1>أداة فحص وتشغيل بلايليست القنوات الذكية ⚡</h1></div>

<div class="controls-container">
  <div class="auto-extract-box">
    <textarea id="autoInput" placeholder="الصق أي كود هنا: JSON أو JS أو Python أو PHP أو M3U أو نص عادي (حتى لو جزء من الملف)..."></textarea>
    <button class="extract-action-btn" onclick="extractPlaylist()">استخراج وفصل القنوات تلقائياً 🔄</button>
  </div>
  <div class="manual-inputs">

    <select id="playerType">

  </div>
  <div class="action-row">
    <div class="buttons-group">

<div class="main-content">
  <div class="player-wrapper"><div id="video-container"></div></div>
  <div class="playlist-box">
    <div style="display:flex;gap:8px;margin-bottom:10px;border-bottom:1px solid #333;padding-bottom:10px;position:sticky;top:-10px;background:#181818;z-index:10;padding-top:10px">
      <input type="text" id="searchInput" placeholder="بحث عن قناة..." oninput="renderPlaylistUI()" style="flex:1;padding:8px;background:#111;border:1px solid #444;color:#fff;border-radius:4px;font-size:13px;outline:none;min-width:0">
      <div id="listCount" style="background:#222;border:1px solid #444;color:#1dcf60;padding:8px 12px;border-radius:4px;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;min-width:25px">0</div>
    </div>
    <div id="playlistContainer"><div style="color:#777;text-align:center;font-size:12px;margin-top:20px">لم يتم استخراج قنوات بعد</div></div>
  </div>

<div id="toast">تم النسخ بنجاح</div>

<script>
let currentShakaPlayer = null, extractedChannels = [], currentFilter = 'all', activeCh = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('toast-show');
  setTimeout(() => t.classList.remove('toast-show'), 2600);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================================================================
   المستخرج الذكي: يعمل على أي صيغة (JSON / JS / Python / PHP / Kotlin / M3U / نص)
   ================================================================ */
const URL_KEYS  = ['link','url','stream','streamurl','streamlink','src','file','source','uri','manifest','mpd','m3u8','hls','dash','playbackurl','videourl','playurl'];
const NAME_KEYS = ['title','name','channel','channelname','label','tvgname','displayname','caption'];
const KEY_KEYS  = ['api','key','keys','licensekey','clearkey','clearkeys','drm','license','drmkey','drmkeys','drmlicense','widevine'];
const KID_KEYS  = ['keyid','kid','k1'];
const KEYV_KEYS = ['k2','keyvalue','key','k'];
const UA_KEYS   = ['useragent','ua','httpuseragent'];
const REF_KEYS  = ['referer','referrer','httpreferer','httpreferrer'];
const ORI_KEYS  = ['origin','httporigin'];
const COOKIE_KEYS = ['cookie','cookies'];
const HDR_BLOB_KEYS = ['headers','header','httpheaders','requestheaders'];
const BAD_URL_KEY = /logo|image|img|icon|poster|thumb|flag|banner|cover|avatar|licen|epg|referer|referrer|origin|website|homepage|page/i;
const PAIR = /(["']?)([A-Za-z_][\w.\-]*)\1\s*(?::|=>|=|->|\bto\b)\s*(?:(["'`])((?:\\.|(?!\3)[^\\\r\n])*)\3|([^\s,;{}\[\]()"'`]+))/g;

const norm = k => k.toLowerCase().replace(/[^a-z0-9]/g, '');
const isUrl = v => /^(https?|rtmps?|rtsp|rtp|udp):\/\//i.test(v);
const unesc = v => v.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16))).replace(/\\(.)/g, '$1');

function b64ToStr(s) {
  try { s = s.trim().replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return atob(s); } catch (e) { return ''; }
}
function b64ToHex(s) {
  const bin = b64ToStr(s); if (!bin) return '';
  return Array.from(bin).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
}

// يقبل الشفرة فقط إذا كانت 32hex:32hex صالحة
function parseKeys(texts) {
  const keys = {};
  const re = /([a-f0-9]{32})["'\s]*[:=,]["'\s]*([a-f0-9]{32})/gi;
  (texts || []).forEach(t => {
    if (!t) return;
    const cands = [t];
    const dec = b64ToStr(t); if (dec) cands.push(dec);
    let found = false;
    cands.forEach(c => {
      let m; re.lastIndex = 0;
      while ((m = re.exec(c))) { keys[m[1].toLowerCase()] = m[2].toLowerCase(); found = true; }
      if (!found && /"k"|"kid"/.test(c)) {            // صيغة ClearKey JSON (base64url)
        try {
          const j = JSON.parse(c.slice(c.indexOf('{'), c.lastIndexOf('}') + 1));
          (j.keys || []).forEach(o => {
            const kid = b64ToHex(o.kid), k = b64ToHex(o.k);
            if (kid.length === 32 && k.length === 32) keys[kid] = k;
          });
        } catch (e) {}
      }
    });
  });
  return keys;
}

function parseHeaderString(str, hdr, keyTexts) {
  if (!str) return;
  str = str.trim();
  if (str[0] === '{') {
    try { const j = JSON.parse(str); Object.keys(j).forEach(k => addHdr(hdr, k, String(j[k]))); return; } catch (e) {}
  }
  str.split(/&(?=[A-Za-z][\w\-]*=)|\r?\n|;(?=\s*[A-Za-z][\w\-]*\s*[:=])/).forEach(p => {
    const m = p.match(/^\s*([A-Za-z][\w\-]*)\s*[=:]\s*([\s\S]*)$/);
    if (!m) return;
    const k = norm(m[1]);
    if (KEY_KEYS.includes(k) && keyTexts) keyTexts.push(m[2].trim());
    else addHdr(hdr, m[1], m[2].trim());
  });
}
function addHdr(hdr, k, v) {
  const n = norm(k);
  if (!v) return;
  if (UA_KEYS.includes(n)) hdr.ua = hdr.ua || v;
  else if (REF_KEYS.includes(n)) hdr.referer = hdr.referer || v;
  else if (ORI_KEYS.includes(n)) hdr.origin = hdr.origin || v;
  else if (COOKIE_KEYS.includes(n)) hdr.cookie = hdr.cookie || v;
}

let skippedEmbeds = 0;
function buildChannel(o) {
  let raw = (o.raw || '').trim(), tail = '';
  const bar = raw.indexOf('|');
  if (bar > -1) { tail = raw.slice(bar + 1); raw = raw.slice(0, bar); }
  const url = raw.trim().replace(/[?&]+$/, '');          // نبقي الـ query string كاملة
  if (!isUrl(url)) return null;

  const hdr = {};
  const keyTexts = (o.keyTexts || []).filter(t => t && !isUrl(t));
  parseHeaderString(tail, hdr, keyTexts);
  parseHeaderString(o.hdrBlob, hdr, keyTexts);
  if (o.ua) hdr.ua = hdr.ua || o.ua;
  if (o.ref) hdr.referer = hdr.referer || o.ref;
  if (o.ori) hdr.origin = hdr.origin || o.ori;
  if (o.cookie) hdr.cookie = hdr.cookie || o.cookie;

  const path = url.split('?')[0].toLowerCase();
  let fmt;
  if (/\.mpd(\/|$)/.test(path)) fmt = 'mpd';
  else if (/\.m3u8?(\/|$)/.test(path)) fmt = 'm3u8';
  else if (/\.ts$/.test(path)) fmt = 'ts';
  else if (String(o.type) === '2') { skippedEmbeds++; return null; }   // صفحة embed
  else if (String(o.type) === '1') fmt = 'mpd';
  else if (String(o.type) === '0') fmt = 'm3u8';
  else fmt = keyTexts.length ? 'mpd' : 'm3u8';

  const keys = fmt === 'mpd' ? parseKeys(keyTexts.concat(tail ? [tail] : [])) : {};
  const first = Object.keys(keys)[0] || '';
  let name = (o.name || '').trim();
  if (!name) { try { name = new URL(url).hostname; } catch (e) { name = 'قناة بدون اسم'; } }

  const hdrParts = [];
  if (hdr.ua) hdrParts.push('User-Agent=' + hdr.ua);
  if (hdr.referer) hdrParts.push('Referer=' + hdr.referer);
  if (hdr.origin) hdrParts.push('Origin=' + hdr.origin);
  if (hdr.cookie) hdrParts.push('Cookie=' + hdr.cookie);

  const need = [];   // يتحدد بعد الفحص الفعلي (probeAll)

  return {
    name, url, fmt, hdr, headers: hdrParts.join('&'), need, hasHdr: need.length > 0,
    k1: first, k2: first ? keys[first] : '', allKeys: keys,
    badKey: fmt === 'mpd' && keyTexts.length > 0 && !first
  };
}

function recordFromBlock(blk) {
  const re = new RegExp(PAIR.source, 'g'), P = [];
  let m;
  while ((m = re.exec(blk))) P.push([norm(m[2]), unesc(m[4] !== undefined ? m[4] : (m[5] || ''))]);
  if (!P.length) return null;
  const get = list => { for (const [k, v] of P) if (list.includes(k) && v) return v; return ''; };

  let raw = '';
  for (const [k, v] of P) if (URL_KEYS.includes(k) && isUrl(v)) { raw = v; break; }
  if (!raw) for (const [k, v] of P) if (isUrl(v) && !BAD_URL_KEY.test(k)) { raw = v; break; }
  if (!raw) return null;

  const keyTexts = [];
  P.forEach(([k, v]) => { if (KEY_KEYS.includes(k) && v) keyTexts.push(v); });
  const kid = get(KID_KEYS), kv = get(KEYV_KEYS);
  if (kid && kv && /^[a-f0-9]{32}$/i.test(kid) && /^[a-f0-9]{32}$/i.test(kv)) keyTexts.push(kid + ':' + kv);

  return buildChannel({
    raw, name: get(NAME_KEYS), type: get(['type']), keyTexts,
    ua: get(UA_KEYS), ref: get(REF_KEYS), ori: get(ORI_KEYS), cookie: get(COOKIE_KEYS), hdrBlob: get(HDR_BLOB_KEYS)
  });
}

// يمشي على الكود ويلتقط أعمق كتلة {..} أو [..] فيها رابط بث = قناة واحدة
function findRecords(text) {
  const recs = [], stack = [], n = text.length;
  let i = 0;
  while (i < n) {
    const c = text[i];
    if (c === '"' || c === "'" || c === '`') {
      let j = i + 1;
      while (j < n && text[j] !== c && text[j] !== '\n') { if (text[j] === '\\') j++; j++; }
      i = j + 1; continue;
    }
    if (c === '{' || c === '[') stack.push({ s: i, rec: false });
    else if (c === '}' || c === ']') {
      const f = stack.pop();
      if (f) {
        let isRec = f.rec;
        if (!f.rec) {
          const r = recordFromBlock(text.slice(f.s, i + 1));
          if (r) { recs.push(r); isRec = true; }
        }
        if (isRec && stack.length) stack[stack.length - 1].rec = true;
      }
    }
    i++;
  }
  return recs;
}

function parseM3U(text) {
  const out = []; let cur = { kt: [] };
  text.split(/\r?\n/).forEach(l => {
    l = l.trim(); if (!l) return;
    if (/^#EXTINF/i.test(l)) {
      const c = l.lastIndexOf(','), t = l.match(/tvg-name="([^"]*)"/i);
      cur.name = (c > -1 ? l.slice(c + 1).trim() : '') || (t ? t[1] : '');
    } else if (l[0] === '#') {
      let m;
      if ((m = l.match(/license_key\s*=\s*(.+)$/i))) cur.kt.push(m[1].trim());
      else if ((m = l.match(/http-user-agent\s*=\s*(.+)$/i))) cur.ua = m[1].trim();
      else if ((m = l.match(/http-refer+er\s*=\s*(.+)$/i))) cur.ref = m[1].trim();
      else if ((m = l.match(/http-origin\s*=\s*(.+)$/i))) cur.ori = m[1].trim();
      else if ((m = l.match(/^#EXTHTTP:(.+)$/i))) cur.hdrBlob = m[1];
    } else if (isUrl(l)) {
      const ch = buildChannel({ raw: l, name: cur.name, type: '', keyTexts: cur.kt, ua: cur.ua, ref: cur.ref, ori: cur.ori, hdrBlob: cur.hdrBlob });
      if (ch) out.push(ch);
      cur = { kt: [] };
    }
  });
  return out;
}

// آخر حل: أي سطر فيه رابط، والاسم هو النص قبله أو السطر السابق
function parseLoose(text) {
  const out = []; let prev = '';
  text.split(/\r?\n/).forEach(line => {
    const m = line.match(/(https?:\/\/[^\s"'<>]+)/);
    if (!m) { if (line.trim()) prev = line.trim(); return; }
    let name = line.slice(0, m.index).replace(/[\s:=,|\-–>"']+$/, '').trim() || prev;
    const ch = buildChannel({ raw: m[1], name, type: '', keyTexts: [line.slice(m.index + m[1].length)] });
    if (ch) out.push(ch);
    prev = '';
  });
  return out;
}

function extractPlaylist() {
  const rawText = document.getElementById('autoInput').value;
  if (!rawText.trim()) { alert("يرجى لصق النص أو الملف أولاً!"); return; }
  skippedEmbeds = 0;

  let list = /#EXTINF/i.test(rawText) ? parseM3U(rawText) : findRecords(rawText);
  if (!list.length) list = parseM3U(rawText);
  if (!list.length) list = parseLoose(rawText);

  const seen = new Set();
  extractedChannels = list.filter(c => {
    const id = c.name + '|' + c.url + '|' + c.k1;
    if (seen.has(id)) return false;
    seen.add(id); return true;
  });

  filterByFormat('all');
  if (extractedChannels.length) {
    selectChannel(0);
    const bad = extractedChannels.filter(c => c.badKey).length;
    const hdr = extractedChannels.filter(c => c.hasHdr).length;
    let msg = `تم استخراج ${extractedChannels.length} قناة`;
    if (bad) msg += ` | ⚠ ${bad} شفرة معطوبة`;
    if (skippedEmbeds) msg += ` | ${skippedEmbeds} embed متجاهلة`;
    showToast(msg);
  } else {
    showToast("لم يتم العثور على قنوات صالحة!");
  }
}

/* ================================================================
   الفحص الفعلي: يجرب كل قناة في المتصفح بدون هيدرز مخصصة ويصنفها من نتيجة التحميل الحقيقية
   ok = تشتغل | hdr = مرفوضة (401/403 أو فشل شبكة) غالباً تحتاج UA/Referer | dead = 404 | key = خطأ شفرة | net = مهلة
   ================================================================ */
const ICONS = { ok: '✅', hdr: '🌐', dead: '❌', key: '⚠', net: '❓', other: '❓' };

function classifyError(e) {
  const code = e && e.code, status = e && e.data && e.data[1];
  if (code === 1001) {
    if ([401, 403, 407].includes(status)) return { s: 'hdr', msg: `🌐 مرفوضة HTTP ${status}: تحتاج User-Agent/Referer غالباً` };
    return { s: 'dead', msg: `❌ HTTP ${status}: الرابط ميت أو منتهي` };
  }
  if (code >= 6000 && code < 7000) return { s: 'key', msg: `⚠ خطأ DRM/شفرة (${code})` };
  if (code === 1002) return { s: 'hdr', msg: '🌐 فشل شبكة (غالباً 403 مخفي بسبب CORS): تحتاج UA/Referer غالباً، أو الرابط ميت' };
  if (code === 1003) return { s: 'net', msg: '❓ انتهت المهلة: بطيئة أو ميتة' };
  return { s: 'other', msg: '❓ خطأ ' + (code || (e && e.message) || '') };
}

async function probeChannel(ch, timeout = 12000) {
  const v = document.createElement('video'); v.muted = true;
  const p = new shaka.Player(v);
  let late = null, timer;
  p.addEventListener('error', ev => { late = late || ev.detail; });
  try {
    if (Object.keys(ch.allKeys).length) p.configure({ drm: { clearKeys: ch.allKeys } });
    await Promise.race([p.load(ch.url), new Promise((_, rej) => { timer = setTimeout(() => rej({ code: 1003 }), timeout); })]);
    clearTimeout(timer);
    await new Promise(r => setTimeout(r, 3500));          // ننتظر أخطاء تحميل أول المقاطع
    if (late) throw late;
    return { s: 'ok', msg: '✅ تشتغل بدون هيدرز مخصصة' };
  } catch (e) { clearTimeout(timer); return classifyError(e); }
  finally { try { await p.destroy(); } catch (e) {} }
}

let probing = false;
async function probeAll() {
  if (probing) return;
  if (!extractedChannels.length) { showToast('استخرج القنوات أولاً!'); return; }
  probing = true;
  const btn = document.getElementById('probeBtn');
  const queue = extractedChannels.slice(); let done = 0;
  const worker = async () => {
    while (queue.length) {
      const ch = queue.shift();
      const r = await probeChannel(ch);
      ch.probe = r; ch.hasHdr = r.s === 'hdr'; ch.need = ch.hasHdr ? ['User-Agent/Referer'] : [];
      done++; btn.innerText = `فحص ${done}/${extractedChannels.length}`;
      if (done % 5 === 0) renderPlaylistUI();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker(), worker()]);
  probing = false; btn.innerText = 'فحص 🧪'; renderPlaylistUI();
  const c = k => extractedChannels.filter(x => x.probe && x.probe.s === k).length;
  showToast(`✅ ${c('ok')} | 🌐 ${c('hdr')} | ❌ ${c('dead')} | ⚠ ${c('key')} | ❓ ${c('net') + c('other')}`);
}

/* ================================================================ */
function codeFor(ch) {
  let c = `{ name: ${JSON.stringify(ch.name)}, url: ${JSON.stringify(ch.url)}`;
  if (ch.k1 && ch.k2) c += `, k1: "${ch.k1}", k2: "${ch.k2}"`;
  if (ch.headers) c += `, headers: ${JSON.stringify(ch.headers)}`;
  return c + ` },`;
}
function copyExtCode(idx, e) { e.stopPropagation(); navigator.clipboard.writeText(codeFor(extractedChannels[idx])).then(() => showToast('تم نسخ كود القناة ✓')); }
function copyLink(idx, e) { e.stopPropagation(); navigator.clipboard.writeText(extractedChannels[idx].url).then(() => showToast('تم نسخ الرابط بنجاح ✓')); }
function copyAllChannels() {
  if (!extractedChannels.length) { showToast('لا توجد قنوات لنسخها!'); return; }
  navigator.clipboard.writeText(extractedChannels.map(codeFor).join('\n')).then(() => showToast(`تم نسخ ${extractedChannels.length} قناة بنجاح ✓`));
}

function filterByFormat(f) {
  currentFilter = f;
  document.querySelectorAll('.counter-badge').forEach(b => b.classList.remove('active'));
  document.getElementById('badge-' + f).classList.add('active');
  renderPlaylistUI();
}

function renderPlaylistUI() {
  const container = document.getElementById('playlistContainer');
  const term = document.getElementById('searchInput').value.toLowerCase().trim();
  const cnt = { mpd: 0, m3u8: 0, ts: 0, hdr: 0 };
  extractedChannels.forEach(c => { cnt[c.fmt]++; if (c.hasHdr) cnt.hdr++; });
  document.getElementById('count-all').innerText = extractedChannels.length;
  ['mpd', 'm3u8', 'ts', 'hdr'].forEach(k => document.getElementById('count-' + k).innerText = cnt[k]);

  const shown = extractedChannels.filter(c => {
    if (currentFilter === 'hdr' && !c.hasHdr) return false;
    if (currentFilter !== 'all' && currentFilter !== 'hdr' && c.fmt !== currentFilter) return false;
    return !term || c.name.toLowerCase().includes(term);
  });
  document.getElementById('listCount').innerText = shown.length;

  if (!extractedChannels.length) {
    container.innerHTML = `<div style="color:#ff4d4d;text-align:center;font-size:12px;margin-top:20px">لم يتم العثور على روابط بث صالحة!</div>`; return;
  }
  if (!shown.length) {
    container.innerHTML = `<div style="color:#777;text-align:center;font-size:12px;margin-top:20px">لا توجد قنوات بهذه المعايير</div>`; return;
  }
  container.innerHTML = shown.map(ch => {
    const i = extractedChannels.indexOf(ch);
    const pr = ch.probe, tip = ch.name + (pr ? '\n' + pr.msg : '') + (ch.badKey ? '\n⚠ شفرة معطوبة' : '');
    const badge = pr ? `<span class="hdr-badge st-${pr.s}" title="${esc(pr.msg)}">${ICONS[pr.s]}</span>` : '';
    return `<div class="playlist-item${activeCh === ch ? ' active' : ''}" id="ch-item-${i}">
      <div class="ch-name" onclick="selectChannel(${i})" title="${esc(tip)}">${i + 1}. ${badge}${!pr && ch.badKey ? '⚠ ' : ''}${esc(ch.name)}</div>
      <div class="ch-actions">
        <button class="icon-btn" onclick="copyExtCode(${i},event)" title="نسخ كود القناة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
        <button class="icon-btn" onclick="copyLink(${i},event)" title="نسخ الرابط المباشر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
      </div></div>`;
  }).join('');
}

function selectChannel(idx) {
  const ch = extractedChannels[idx];
  activeCh = ch;
  document.getElementById('streamUrl').value = ch.url;
  document.getElementById('keyId').value = ch.k1;
  document.getElementById('keyVal').value = ch.k2;
  document.querySelectorAll('.playlist-item').forEach(el => el.classList.toggle('active', el.id === `ch-item-${idx}`));
  testStream();
}

function stepChannel(dir) {
  const items = Array.from(document.querySelectorAll('.playlist-item'));
  const a = items.findIndex(el => el.classList.contains('active'));
  const t = items[a + dir];
  if (a === -1 || !t) return;
  selectChannel(parseInt(t.id.replace('ch-item-', '')));
  t.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
const playNextChannel = () => stepChannel(1);
const playPrevChannel = () => stepChannel(-1);

function clearAll() {
  ['autoInput', 'streamUrl', 'keyId', 'keyVal', 'searchInput'].forEach(id => document.getElementById(id).value = '');
  extractedChannels = []; activeCh = null;
  filterByFormat('all');
  document.getElementById('playlistContainer').innerHTML = `<div style="color:#777;text-align:center;font-size:12px;margin-top:20px">تم التطهير بنجاح</div>`;
  document.getElementById('listCount').innerText = '0';
  document.getElementById('video-container').innerHTML = '';
  if (currentShakaPlayer) { currentShakaPlayer.destroy(); currentShakaPlayer = null; }
}

function testStream() {
  const url = document.getElementById('streamUrl').value.trim();
  const k1 = document.getElementById('keyId').value.trim();
  const k2 = document.getElementById('keyVal').value.trim();
  const playerType = document.getElementById('playerType').value;
  const container = document.getElementById('video-container');
  if (!url) { alert("يرجى إدخال أو اختيار رابط قناة صالح أولاً!"); return; }

  container.innerHTML = '';
  if (currentShakaPlayer) { currentShakaPlayer.destroy(); currentShakaPlayer = null; }

  const ch = (activeCh && activeCh.url === url) ? activeCh : null;
  const isDash = ch ? ch.fmt === 'mpd' : /\.mpd(\/|$)/i.test(url.split('?')[0]);
  let keysMap = {};
  if (ch && Object.keys(ch.allKeys).length) keysMap = ch.allKeys;
  else if (k1 && k2) keysMap[k1] = k2;

  if (playerType === 'jw') {
    container.innerHTML = '<div id="jw-player" style="width:100%;height:100%"></div>';
    const cfg = { file: url, type: isDash ? 'dash' : 'hls', width: "100%", height: "100%", autostart: true, stretching: "uniform" };
    if (k1 && k2) cfg.drm = { clearkey: { keyId: k1, key: k2 } };
    const p = jwplayer("jw-player").setup(cfg);
    p.on('ready', function () {
      let stretched = false;
      const icon = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";
      p.addButton(icon, "توسيع/تضييق الصورة", function () {
        p.setConfig({ stretching: stretched ? "uniform" : "exactfit" }); stretched = !stretched;
      }, "stretch-button");
    });
  } else {
    container.innerHTML = `<div id="shaka-ui-container" dir="ltr" style="width:100%;height:100%;position:relative"><video id="shaka-video" style="width:100%;height:100%;object-fit:contain" autoplay></video></div>`;
    const v = document.getElementById('shaka-video');
    currentShakaPlayer = new shaka.Player(v);
    new shaka.ui.Overlay(currentShakaPlayer, document.getElementById('shaka-ui-container'), v);
    if (Object.keys(keysMap).length) currentShakaPlayer.configure({ drm: { clearKeys: keysMap } });
    currentShakaPlayer.load(url).catch(function (e) {
      console.error('Error loading video', e);
      alert("حدث خطأ أثناء تحميل البث، تأكد من صحة الرابط ومفاتيح فك التشفير.");
    });
  }
}

document.addEventListener('DOMContentLoaded', () => { shaka.polyfill.installAll(); });
</script>
