<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>
html{background:#181818}
body{margin:0;padding:0;background:transparent;color:#fff;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;position:relative;z-index:0}
body::before{content:"";position:fixed;inset:0;background:url('https://i.postimg.cc/9FJ0trLQ/Gemini-Generated-Image-8ly23a8ly23a8ly2.jpg') center/cover no-repeat;z-index:-2}
body::after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(8,10,8,.86) 0%,rgba(8,10,8,.78) 45%,rgba(8,10,8,.88) 100%);z-index:-1}
.header{background:rgba(17,17,17,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:15px;border-bottom:2px solid #1dcf60;text-align:center;flex-shrink:0;position:relative;z-index:1}
.header h1{margin:0;font-size:22px;color:#1dcf60;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.controls-container{padding:20px;background:rgba(17,17,17,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:15px;width:95%;max-width:1000px;margin:15px auto;flex-shrink:0;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);box-sizing:border-box;position:relative;z-index:1}
.auto-extract-box{width:100%;display:flex;flex-direction:column;gap:10px}
.auto-extract-box textarea{width:100%;height:100px;padding:12px;background:#1a2a20;border:1px dashed #1dcf60;color:#fff;border-radius:6px;font-size:14px;outline:none;resize:none;box-sizing:border-box}
.auto-extract-box textarea::placeholder{color:#88c79c}
.extract-action-btn{padding:12px;background:#0084ff;color:#fff;border:none;font-weight:bold;border-radius:6px;cursor:pointer;transition:.2s;font-size:15px}
.extract-action-btn:hover{background:#006bd6}
.manual-inputs{display:flex;flex-wrap:wrap;gap:10px;width:100%;align-items:center}
input[type=text],select{padding:12px;background:#111;border:1px solid #444;color:#fff;border-radius:6px;font-size:14px;outline:none;flex:1;min-width:180px}
input[type=text]:focus,select:focus{border-color:#1dcf60}
.action-row{display:flex;gap:10px;width:100%;align-items:center;justify-content:space-between}
.buttons-group{display:flex;gap:10px;flex:1;max-width:350px}
button.play-btn{padding:10px 15px;background:#1dcf60;color:#000;border:none;flex:2;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;transition:.2s}
button.play-btn:hover{background:#17a84e}
button.clear-btn{padding:10px 15px;background:#ff4d4d;color:#fff;border:none;flex:1;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;transition:.2s}
button.clear-btn:hover{background:#c00}
.counters-container{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex:2;flex-wrap:nowrap}
.counter-badge{background:#222;border:1px solid #333;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:bold;display:flex;align-items:center;gap:6px;cursor:pointer;opacity:.5;transition:all .2s;white-space:nowrap}
.counter-badge:hover{opacity:.8}
.counter-badge.active{opacity:1;transform:scale(1.05);border-width:2px}
.counter-badge span.count{padding:2px 6px;border-radius:4px;font-size:11px;color:#fff}
.counter-all{border-color:#444;color:#ccc;opacity:.9}.counter-all span.count{background:#343c4a;color:#fff}
.counter-all.active{border-color:#1dcf60;color:#1dcf60}.counter-all.active span.count{background:#1dcf60;color:#000}
.group-btn{background:#222;border:1px solid #444;color:#ccc;border-radius:6px;padding:7px 9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.group-btn svg{width:20px;height:20px}
.group-btn:hover{background:#2c2c2c;color:#fff;border-color:#555}
.group-btn.active,.group-btn.active:hover{background:#1a3a24;border-color:#1dcf60;color:#1dcf60}
/* القايمة موجودة مباشرة جوه الـ body (مش جوه مربع التحكم) فبتظهر فوق مربع القنوات */
.group-menu{display:none;position:fixed;box-sizing:border-box;overflow-y:auto;background:#1c1c1c;border:1px solid #444;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.7);z-index:500;padding:6px}
.group-menu.open{display:block}
.group-menu::-webkit-scrollbar{width:6px}
.group-menu::-webkit-scrollbar-thumb{background:#444;border-radius:10px}
.gm-title{font-size:11px;color:#1dcf60;padding:6px 8px 4px;border-bottom:1px solid #333;margin-bottom:4px}
.gm-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;cursor:pointer;font-size:13px}
.gm-item:hover{background:#2c3a30}

.gm-label{flex:1}
.gm-item .count{flex-shrink:0;min-width:18px;text-align:center;background:#343c4a;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:bold}
.playlist-box.flash{box-shadow:0 0 0 2px #1dcf60,0 0 14px rgba(29,207,96,.5)}
.copy-all-btn,.nav-btn{color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.copy-all-btn{background:#343c4a;border:1px solid #475569;gap:6px;font-size:13px;font-weight:bold}
.copy-all-btn:hover{background:#1dcf60;color:#000;border-color:#1dcf60}
.nav-btn{background:#2a2a2a;color:#ddd;border:1px solid #444}
.nav-btn:hover{background:#383838;color:#fff;border-color:#555}
.copy-all-btn svg,.nav-btn svg{width:16px;height:16px}
.main-content{display:flex;flex-direction:row;gap:20px;width:95%;max-width:1000px;margin:0 auto 15px;align-items:stretch;flex:1;min-height:0;box-sizing:border-box;position:relative;z-index:1}
.player-wrapper{flex:3;background:#000;border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,.8);position:relative;min-width:0;height:100%;overflow:hidden}
#video-container{width:100%;height:100%}
.playlist-box{flex:1.2;background:rgba(24,24,24,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:8px;height:100%;overflow-y:auto;padding:10px;box-sizing:border-box}
.playlist-box::-webkit-scrollbar{width:6px}
.playlist-box::-webkit-scrollbar-thumb{background:#444;border-radius:10px}
.pl-head{position:sticky;top:-10px;background:rgba(24,24,24,.92);z-index:10;padding:10px 0;margin-bottom:10px;border-bottom:1px solid #333}
.pl-row{display:flex;align-items:center;gap:8px;min-height:34px}
.pl-type{flex:1;min-width:0;font-size:12px;font-weight:bold;color:#e2e8f0;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-prog{font-size:11px;color:#f1c40f;flex-shrink:0}
.pl-search-btn{background:#222;border:1px solid #444;color:#ccc;border-radius:4px;padding:7px 9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pl-search-btn:hover{background:#2c2c2c;color:#fff;border-color:#555}
.pl-search-btn.active{border-color:#1dcf60;color:#1dcf60;background:#1a3a24}
.pl-search-btn svg{width:16px;height:16px}
.pl-search{display:none;width:100%;margin-top:8px;padding:8px;background:#111;border:1px solid #444;color:#fff;border-radius:4px;font-size:13px;outline:none;box-sizing:border-box}
.pl-search:focus{border-color:#1dcf60}
.playlist-item{padding:8px;background:#222;margin-bottom:6px;border-radius:4px;transition:.2s;display:flex;justify-content:space-between;align-items:center;gap:10px;scroll-margin-top:60px}
.playlist-item:hover{background:#2a2a2a;border-right:3px solid #1dcf60}
.playlist-item.active{background:#1a3a24;border-right:3px solid #1dcf60}
.ch-name{flex:1;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playlist-item.active .ch-name{color:#88c79c;font-weight:bold}
.hdr-badge{display:inline-block;color:#000;font-size:10px;font-weight:bold;border-radius:3px;padding:0 4px;margin:0 2px;cursor:help}
.st-ok{background:#1dcf60}.st-dead{background:#e74c3c}.st-key{background:#f1c40f}.st-hdr{background:#e67e22}.st-net,.st-other{background:#777}
.ch-actions{display:flex;gap:5px}
.icon-btn{background:#343c4a;color:#e2e8f0;border:none;border-radius:4px;padding:6px 8px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#1dcf60;color:#000}
.icon-btn svg{width:14px;height:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1dcf60;color:#000;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:bold;opacity:0;transition:opacity .3s;z-index:1000;pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.toast-show{opacity:1!important}
.jw-icon-playlist,.jw-icon-next,.jw-related-btn{display:none!important}
@media (max-width:768px){
body{height:auto;overflow:visible}
.main-content{flex-direction:column;height:500px;flex:none}
.player-wrapper,.playlist-box{width:100%;flex:none;height:50%}
.action-row{flex-wrap:wrap}
.counters-container{justify-content:center;width:100%;flex-wrap:wrap}
}
</style>

<body>
<div class="header"><h1>Stream Tester⚡</h1></div>

<div class="controls-container">
  <div class="auto-extract-box">
    <textarea id="autoInput" placeholder="الصق أي كود هنا: JSON أو JS أو Python أو PHP أو M3U أو نص عادي (حتى لو جزء من الملف)..."></textarea>
    <button class="extract-action-btn" onclick="extractPlaylist()">استخراج وفصل القنوات تلقائياً 🔄</button>
  </div>
  <div class="manual-inputs">
    <input type="text" id="streamUrl" placeholder="رابط القناة (URL)">
    <input type="text" id="keyId" placeholder="Key ID (k1)">
    <input type="text" id="keyVal" placeholder="Key (k2)">
    <select id="playerType">
      <option value="jw">JW Player (المفضل)</option>
      <option value="shaka">Shaka Player</option>
    </select>
  </div>
  <div class="action-row">
    <div class="buttons-group">
      <button class="play-btn" id="playBtn" onclick="togglePlay()" title="تشغيل القناة المحددة / إيقافها إيقافاً تاماً">تشغيل/إيقاف ▶</button>
      <button class="clear-btn" onclick="clearAll()">مسح الكل 🗑️</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="nav-btn" onclick="playPrevChannel()" title="القناة السابقة"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8l-6 8h12z"/></svg></button>
      <button class="nav-btn" onclick="playNextChannel()" title="القناة التالية"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 16l6-8H6z"/></svg></button>
    </div>
    <div class="counters-container">
      <div id="badge-all" class="counter-badge counter-all active" onclick="filterByFormat('all')">الكل <span class="count" id="count-all">0</span></div>
      <button class="copy-all-btn" onclick="copyShown()" title="نسخ أكواد القنوات المعروضة في مربع القنوات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span id="listCount">0</span>
      </button>
      <button class="group-btn" onclick="toggleGroupMenu(event)" title="تقسيم القنوات ونسخ كل مجموعة كأكواد">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="player-wrapper"><div id="video-container"></div></div>
  <div class="playlist-box">
    <div class="pl-head">
      <div class="pl-row">
        <span class="pl-type" id="shownType"></span>
        <span class="pl-prog" id="probeProg"></span>
        <button class="pl-search-btn" id="searchBtn" onclick="toggleSearch()" title="بحث عن قناة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      </div>
      <input type="text" class="pl-search" id="searchInput" placeholder="بحث عن قناة..." oninput="renderPlaylistUI()" onkeydown="if(event.key==='Escape')toggleSearch(false)">
    </div>
    <div id="playlistContainer"><div style="color:#777;text-align:center;font-size:12px;margin-top:20px">لم يتم استخراج قنوات بعد</div></div>
  </div>
</div>

<!-- قايمة تقسيم القنوات: ابن مباشر للـ body عشان تظهر فوق مربع القنوات -->
<div class="group-menu" id="groupMenu" onclick="event.stopPropagation()"></div>
<div id="toast">تم النسخ بنجاح</div>

<script>
let currentShakaPlayer = null, extractedChannels = [], currentFilter = 'all', activeCh = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('toast-show');
  setTimeout(() => t.classList.remove('toast-show'), 2600);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const URL_KEYS  = ['link','url','stream','streamurl','streamlink','src','file','source','uri','manifest','mpd','m3u8','hls','dash','playbackurl','videourl','playurl'];
const NAME_KEYS = ['title','name','channel','channelname','label','tvgname','displayname','caption'];
const KEY_KEYS  = ['api','key','keys','licensekey','clearkey','clearkeys','drm','license','drmkey','drmkeys','drmlicense','widevine'];
const KID_KEYS  = ['keyid','kid','k1'];
const KEYV_KEYS = ['k2','keyvalue','key','k'];
const UA_KEYS   = ['useragent','ua','httpuseragent'];
const REF_KEYS  = ['referer','referrer','httpreferer','httpreferrer'];
const ORI_KEYS  = ['origin','httporigin'];
const COOKIE_KEYS = ['cookie','cookies'];
const HDR_BLOB_KEYS = ['headers','header','httpheaders','requestheaders'];
const BAD_URL_KEY = /logo|image|img|icon|poster|thumb|flag|banner|cover|avatar|licen|epg|referer|referrer|origin|website|homepage|page/i;
const PAIR = /(["']?)([A-Za-z_][\w.\-]*)\1\s*(?::|=>|=|->|\bto\b)\s*(?:(["'`])((?:\\.|(?!\3)[^\\\r\n])*)\3|([^\s,;{}\[\]()"'`]+))/g;

const norm = k => k.toLowerCase().replace(/[^a-z0-9]/g, '');
const isUrl = v => /^(https?|rtmps?|rtsp|rtp|udp):\/\//i.test(v);
const unesc = v => v.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16))).replace(/\\(.)/g, '$1');

function b64ToStr(s) {
  try { s = s.trim().replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return atob(s); } catch (e) { return ''; }
}
function b64ToHex(s) {
  const bin = b64ToStr(s); if (!bin) return '';
  return Array.from(bin).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
}

function parseKeys(texts) {
  const keys = {};
  const re = /([a-f0-9]{32})["'\s]*[:=,]["'\s]*([a-f0-9]{32})/gi;
  (texts || []).forEach(t => {
    if (!t) return;
    const cands = [t];
    const dec = b64ToStr(t); if (dec) cands.push(dec);
    let found = false;
    cands.forEach(c => {
      let m; re.lastIndex = 0;
      while ((m = re.exec(c))) { keys[m[1].toLowerCase()] = m[2].toLowerCase(); found = true; }
      if (!found && /"k"|"kid"/.test(c)) {
        try {
          const j = JSON.parse(c.slice(c.indexOf('{'), c.lastIndexOf('}') + 1));
          (j.keys || []).forEach(o => {
            const kid = b64ToHex(o.kid), k = b64ToHex(o.k);
            if (kid.length === 32 && k.length === 32) keys[kid] = k;
          });
        } catch (e) {}
      }
    });
  });
  return keys;
}

function addHdr(hdr, k, v) {
  const n = norm(k);
  if (!v) return;
  if (UA_KEYS.includes(n)) hdr.ua = hdr.ua || v;
  else if (REF_KEYS.includes(n)) hdr.referer = hdr.referer || v;
  else if (ORI_KEYS.includes(n)) hdr.origin = hdr.origin || v;
  else if (COOKIE_KEYS.includes(n)) hdr.cookie = hdr.cookie || v;
}
function parseHeaderString(str, hdr, keyTexts) {
  if (!str) return;
  str = str.trim();
  if (str[0] === '{') {
    try { const j = JSON.parse(str); Object.keys(j).forEach(k => addHdr(hdr, k, String(j[k]))); return; } catch (e) {}
  }
  str.split(/&(?=[A-Za-z][\w\-]*=)|\r?\n|;(?=\s*[A-Za-z][\w\-]*\s*[:=])/).forEach(p => {
    const m = p.match(/^\s*([A-Za-z][\w\-]*)\s*[=:]\s*([\s\S]*)$/);
    if (!m) return;
    if (KEY_KEYS.includes(norm(m[1])) && keyTexts) keyTexts.push(m[2].trim());
    else addHdr(hdr, m[1], m[2].trim());
  });
}

let skippedEmbeds = 0;
function buildChannel(o) {
  let raw = (o.raw || '').trim(), tail = '';
  const bar = raw.indexOf('|');
  if (bar > -1) { tail = raw.slice(bar + 1); raw = raw.slice(0, bar); }
  const url = raw.trim().replace(/[?&]+$/, '');
  if (!isUrl(url)) return null;

  const hdr = {};
  const keyTexts = (o.keyTexts || []).filter(t => t && !isUrl(t));
  parseHeaderString(tail, hdr, keyTexts);
  parseHeaderString(o.hdrBlob, hdr, keyTexts);
  if (o.ua) hdr.ua = hdr.ua || o.ua;
  if (o.ref) hdr.referer = hdr.referer || o.ref;
  if (o.ori) hdr.origin = hdr.origin || o.ori;
  if (o.cookie) hdr.cookie = hdr.cookie || o.cookie;

  const path = url.split('?')[0].toLowerCase();
  let fmt;
  if (!/^https?:/i.test(url) || /\.(mp4|mkv|flv|webm|mp3|aac|avi)$/.test(path)) fmt = 'other';
  else if (/\.mpd(\/|$)/.test(path)) fmt = 'mpd';
  else if (/\.m3u8?(\/|$)/.test(path)) fmt = 'm3u8';
  else if (/\.ts$/.test(path)) fmt = 'ts';
  else if (String(o.type) === '2') { skippedEmbeds++; return null; }
  else if (String(o.type) === '1') fmt = 'mpd';
  else if (String(o.type) === '0') fmt = 'm3u8';
  else fmt = keyTexts.length ? 'mpd' : 'm3u8';

  const keys = fmt === 'mpd' ? parseKeys(keyTexts.concat(tail ? [tail] : [])) : {};
  const first = Object.keys(keys)[0] || '';
  let name = (o.name || '').trim();
  if (!name) { try { name = new URL(url).hostname; } catch (e) { name = 'قناة بدون اسم'; } }

  const hdrParts = [];
  if (hdr.ua) hdrParts.push('User-Agent=' + hdr.ua);
  if (hdr.referer) hdrParts.push('Referer=' + hdr.referer);
  if (hdr.origin) hdrParts.push('Origin=' + hdr.origin);
  if (hdr.cookie) hdrParts.push('Cookie=' + hdr.cookie);

  return {
    name, url, fmt, headers: hdrParts.join('&'),
    k1: first, k2: first ? keys[first] : '', allKeys: keys,
    badKey: fmt === 'mpd' && keyTexts.length > 0 && !first
  };
}

function recordFromBlock(blk) {
  const re = new RegExp(PAIR.source, 'g'), P = [];
  let m;
  while ((m = re.exec(blk))) P.push([norm(m[2]), unesc(m[4] !== undefined ? m[4] : (m[5] || ''))]);
  if (!P.length) return null;
  const get = list => { for (const [k, v] of P) if (list.includes(k) && v) return v; return ''; };

  let raw = '';
  for (const [k, v] of P) if (URL_KEYS.includes(k) && isUrl(v)) { raw = v; break; }
  if (!raw) for (const [k, v] of P) if (isUrl(v) && !BAD_URL_KEY.test(k)) { raw = v; break; }
  if (!raw) return null;

  const keyTexts = [];
  P.forEach(([k, v]) => { if (KEY_KEYS.includes(k) && v) keyTexts.push(v); });
  const kid = get(KID_KEYS), kv = get(KEYV_KEYS);
  if (kid && kv && /^[a-f0-9]{32}$/i.test(kid) && /^[a-f0-9]{32}$/i.test(kv)) keyTexts.push(kid + ':' + kv);

  return buildChannel({
    raw, name: get(NAME_KEYS), type: get(['type']), keyTexts,
    ua: get(UA_KEYS), ref: get(REF_KEYS), ori: get(ORI_KEYS), cookie: get(COOKIE_KEYS), hdrBlob: get(HDR_BLOB_KEYS)
  });
}

function findRecords(text) {
  const recs = [], stack = [], n = text.length;
  let i = 0;
  while (i < n) {
    const c = text[i];
    if (c === '"' || c === "'" || c === '`') {
      let j = i + 1;
      while (j < n && text[j] !== c && text[j] !== '\n') { if (text[j] === '\\') j++; j++; }
      i = j + 1; continue;
    }
    if (c === '{' || c === '[') stack.push({ s: i, rec: false });
    else if (c === '}' || c === ']') {
      const f = stack.pop();
      if (f) {
        let isRec = f.rec;
        if (!f.rec) {
          const r = recordFromBlock(text.slice(f.s, i + 1));
          if (r) { recs.push(r); isRec = true; }
        }
        if (isRec && stack.length) stack[stack.length - 1].rec = true;
      }
    }
    i++;
  }
  return recs;
}

function parseM3U(text) {
  const out = []; let cur = { kt: [] };
  text.split(/\r?\n/).forEach(l => {
    l = l.trim(); if (!l) return;
    if (/^#EXTINF/i.test(l)) {
      const c = l.lastIndexOf(','), t = l.match(/tvg-name="([^"]*)"/i);
      cur.name = (c > -1 ? l.slice(c + 1).trim() : '') || (t ? t[1] : '');
    } else if (l[0] === '#') {
      let m;
      if ((m = l.match(/license_key\s*=\s*(.+)$/i))) cur.kt.push(m[1].trim());
      else if ((m = l.match(/http-user-agent\s*=\s*(.+)$/i))) cur.ua = m[1].trim();
      else if ((m = l.match(/http-refer+er\s*=\s*(.+)$/i))) cur.ref = m[1].trim();
      else if ((m = l.match(/http-origin\s*=\s*(.+)$/i))) cur.ori = m[1].trim();
      else if ((m = l.match(/^#EXTHTTP:(.+)$/i))) cur.hdrBlob = m[1];
    } else if (isUrl(l)) {
      const ch = buildChannel({ raw: l, name: cur.name, type: '', keyTexts: cur.kt, ua: cur.ua, ref: cur.ref, ori: cur.ori, hdrBlob: cur.hdrBlob });
      if (ch) out.push(ch);
      cur = { kt: [] };
    }
  });
  return out;
}

function parseLoose(text) {
  const out = []; let prev = '';
  text.split(/\r?\n/).forEach(line => {
    const m = line.match(/(https?:\/\/[^\s"'<>]+)/);
    if (!m) { if (line.trim()) prev = line.trim(); return; }
    let name = line.slice(0, m.index).replace(/[\s:=,|\-–>"']+$/, '').trim() || prev;
    const ch = buildChannel({ raw: m[1], name, type: '', keyTexts: [line.slice(m.index + m[1].length)] });
    if (ch) out.push(ch);
    prev = '';
  });
  return out;
}

function extractPlaylist() {
  const rawText = document.getElementById('autoInput').value;
  if (!rawText.trim()) { alert("يرجى لصق النص أو الملف أولاً!"); return; }
  skippedEmbeds = 0;

  let list = /#EXTINF/i.test(rawText) ? parseM3U(rawText) : findRecords(rawText);
  if (!list.length) list = parseM3U(rawText);
  if (!list.length) list = parseLoose(rawText);

  const seen = new Set();
  extractedChannels = list.filter(c => {
    const id = c.name + '|' + c.url + '|' + c.k1;
    if (seen.has(id)) return false;
    seen.add(id); return true;
  });

  filterByFormat('all');
  if (extractedChannels.length) {
    selectChannel(0);
    const bad = extractedChannels.filter(c => c.badKey).length;
    let msg = `تم استخراج ${extractedChannels.length} قناة`;
    if (bad) msg += ` | ⚠ ${bad} شفرة معطوبة`;
    if (skippedEmbeds) msg += ` | ${skippedEmbeds} embed متجاهلة`;
    showToast(msg);
    probeAll();
  } else {
    showToast("لم يتم العثور على قنوات صالحة!");
  }
}

const ICONS = { ok: '✅', hdr: '🌐', dead: '❌', key: '⚠', net: '❓', other: '❓' };

function classifyError(e) {
  const code = e && e.code, status = e && e.data && e.data[1];
  if (code === 1001) {
    if ([401, 403, 407].includes(status)) return { s: 'hdr', msg: `🌐 مرفوضة HTTP ${status}: تحتاج User-Agent/Referer غالباً` };
    return { s: 'dead', msg: `❌ HTTP ${status}: الرابط ميت أو منتهي` };
  }
  if (code >= 6000 && code < 7000) return { s: 'key', msg: `⚠ خطأ DRM/شفرة (${code})` };
  if (code === 1002) return { s: 'hdr', msg: '🌐 فشل شبكة (غالباً 403 مخفي بسبب CORS): تحتاج UA/Referer غالباً، أو الرابط ميت' };
  if (code === 1003) return { s: 'net', msg: '❓ انتهت المهلة: بطيئة أو ميتة' };
  return { s: 'other', msg: '❓ خطأ ' + (code || (e && e.message) || '') };
}

/* ====== الفحص في الخلفية ======
   1) مؤقت داخل Worker: المتصفح ما بيخنقوش لما التاب يبقى في الخلفية
   2) صوت صامت + Web Lock + Wake Lock: بتشتغل أثناء الفحص فقط وبتتقفل أول ما يخلص */
const timerWorker = new Worker(URL.createObjectURL(new Blob([
  'onmessage=e=>{const d=e.data;setTimeout(()=>postMessage(d.id),d.ms)}'
])));
const waiters = new Map(); let tid = 0;
timerWorker.onmessage = e => { const f = waiters.get(e.data); waiters.delete(e.data); if (f) f(); };
const sleep = ms => new Promise(r => { const id = ++tid; waiters.set(id, r); timerWorker.postMessage({ id, ms }); });

let keepAlive = null;
async function startKeepAlive() {
  stopKeepAlive();
  const ka = { ctx: null, osc: null, wake: null, release: null, stopped: false };
  keepAlive = ka; // يتسجل فوراً عشان stopKeepAlive تلاقيه حتى لو لسه بيتجهز
  try {
    ka.ctx = new (window.AudioContext || window.webkitAudioContext)();
    ka.osc = ka.ctx.createOscillator();
    const g = ka.ctx.createGain();
    ka.osc.frequency.value = 25;   // تردد غير مسموع
    g.gain.value = 0.001;          // شبه صامت (لو مش كفاية جرب 0.005)
    ka.osc.connect(g); g.connect(ka.ctx.destination); ka.osc.start();
  } catch (e) {}
  try {
    if (navigator.locks) navigator.locks.request('probe-keepalive', () => new Promise(r => { ka.release = r; }));
  } catch (e) {}
  try {
    if (navigator.wakeLock) {
      const w = await navigator.wakeLock.request('screen');
      if (ka.stopped) w.release(); else ka.wake = w; // لو الفحص خلص أثناء الانتظار
    }
  } catch (e) {}
}
function stopKeepAlive() {
  const ka = keepAlive;
  if (!ka) return;
  keepAlive = null; ka.stopped = true;
  try { ka.osc && ka.osc.stop(); } catch (e) {}
  try { ka.ctx && ka.ctx.close(); } catch (e) {}
  try { ka.release && ka.release(); } catch (e) {}
  try { ka.wake && ka.wake.release(); } catch (e) {}
}

async function probeChannel(ch, timeout = 12000) {
  const v = document.createElement('video'); v.muted = true; v.playsInline = true;
  v.style.cssText = 'position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px;top:-10px';
  document.body.appendChild(v);
  const p = new shaka.Player(v);
  let late = null;
  p.addEventListener('error', ev => { late = late || ev.detail; });
  try {
    if (Object.keys(ch.allKeys).length) p.configure({ drm: { clearKeys: ch.allKeys } });
    await Promise.race([
      p.load(ch.url),
      sleep(timeout).then(() => { throw { code: 1003 }; })
    ]);
    await sleep(3500);
    if (late) throw late;
    return { s: 'ok', msg: '✅ تشتغل بدون هيدرز مخصصة' };
  } catch (e) { return classifyError(e); }
  finally { try { await p.destroy(); } catch (e) {} v.remove(); }
}

let probeToken = 0;
async function probeAll() {
  const token = ++probeToken;
  startKeepAlive();
  const list = extractedChannels.slice(), queue = list.slice();
  const prog = document.getElementById('probeProg');
  let done = 0;
  const worker = async () => {
    while (queue.length && token === probeToken) {
      const ch = queue.shift();
      const r = await probeChannel(ch);
      if (token !== probeToken) return;
      ch.probe = r;
      done++; prog.textContent = `فحص ${done}/${list.length}`;
      if (done % 4 === 0) renderPlaylistUI();
    }
  };
  try {
    await Promise.all([worker(), worker(), worker(), worker(), worker()]);
  } finally {
    // يوقف الصوت فقط لو ده لسه الفحص الحالي (مش فحص جديد بدأ بعده)
    if (token === probeToken) stopKeepAlive();
  }
  if (token !== probeToken) { prog.textContent = ''; return; }
  prog.textContent = ''; renderPlaylistUI();
  const c = k => list.filter(x => x.probe && x.probe.s === k).length;
  showToast(`انتهى الفحص: ✅ ${c('ok')} | 🌐 ${c('hdr')} | ❌ ${c('dead')} | ⚠ ${c('key')} | ❓ ${c('net') + c('other')}`);
}

const pr_ = c => c.probe && c.probe.s;
const GROUPS = {
  mpd:   { label: 'MPD',            test: c => c.fmt === 'mpd' },
  m3u8:  { label: 'M3U8',           test: c => c.fmt === 'm3u8' },
  extra: { label: 'صيغ إضافية',     hint: 'TS وغيرها', test: c => c.fmt === 'ts' || c.fmt === 'other' },
  bad:   { label: 'قنوات معطّلة',   hint: 'ميتة / شفرة خاطئة', test: c => c.badKey || ['dead', 'key'].includes(pr_(c)) },
  ok:    { label: '✅ تشتغل بدون هيدرز', test: c => pr_(c) === 'ok' },
  hdr:   { label: '🌐 مرفوضة (401 / 403) أو فشل شبكة', hint: 'غالباً تحتاج UA أو Referer', test: c => pr_(c) === 'hdr' },
  dead:  { label: '❌ الرابط ميت', test: c => pr_(c) === 'dead' },
  key:   { label: '⚠ خطأ في الشفرة', test: c => c.badKey || pr_(c) === 'key' },
  net:   { label: '❓ انتهت المهلة', test: c => ['net', 'other'].includes(pr_(c)) }
};

function codeFor(ch) {
  let c = `{ name: ${JSON.stringify(ch.name)}, url: ${JSON.stringify(ch.url)}`;
  if (ch.k1 && ch.k2) c += `, k1: "${ch.k1}", k2: "${ch.k2}"`;
  if (ch.headers) c += `, headers: ${JSON.stringify(ch.headers)}`;
  return c + ` },`;
}
function copyExtCode(idx, e) { e.stopPropagation(); navigator.clipboard.writeText(codeFor(extractedChannels[idx])).then(() => showToast('تم نسخ كود القناة ✓')); }
function copyLink(idx, e) { e.stopPropagation(); navigator.clipboard.writeText(extractedChannels[idx].url).then(() => showToast('تم نسخ الرابط بنجاح ✓')); }
function getShownChannels() {
  const term = document.getElementById('searchInput').value.toLowerCase().trim();
  return extractedChannels.filter(c => {
    if (currentFilter !== 'all' && GROUPS[currentFilter] && !GROUPS[currentFilter].test(c)) return false;
    return !term || c.name.toLowerCase().includes(term);
  });
}
function copyShown() {
  const list = getShownChannels();
  if (!list.length) { showToast('لا توجد قنوات لنسخها!'); return; }
  navigator.clipboard.writeText(list.map(codeFor).join('\n')).then(() => showToast(`تم نسخ ${list.length} قناة ✓`));
}

      p.addButton(icon, "توسيع/تضييق الصورة", function () {

      const sx = (img.naturalWidth - s) / 2, sy = (img.naturalHeight - s) / 2;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, SIZE, SIZE);
      const data = c.toDataURL('image/png');
      const f = document.getElementById('favicon');
      f.type = 'image/png'; f.sizes = SIZE + 'x' + SIZE; f.href = data;
      document.getElementById('touchIcon').href = data;
    } catch (e) { }
  };
  img.src = SRC;
})();
</script>
